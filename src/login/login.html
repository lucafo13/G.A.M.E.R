<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G.A.M.E.R -- login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../CSS/login.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="shortcut icon" href="../assets/icones/auradelciofinal.png" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
</head>
<body>
    <main>
        <article class="logo-patch">
            <div class="img-counter">
                <img src="../../assets/icones/auradelciofinal.png" alt="" class="img-login">
                <br>
                <button class="btn-custom" id="log">Entrar</button>
            </div>
        </article>
        <article>
            <div class="login">
                <h1>Faça o cadastro da sua conta</h1>
                <h2>Preencha seus dados</h2>
                <form action="">
                <div class="caixaput">
                 <i class="bi bi-person"></i>
                <input type="text" required class="name-input" placeholder="Nome" id="input-name">
                </div>
                <div class="caixaput">
                    <i class="bi bi-envelope"></i>  
                    <input type="email" required class="email-input" id="input-email" placeholder="Email">
                </div>
                <div class="caixaput">
                    <i class="bi bi-key"></i>
                    <input type="password" required class="pass-input" id="input-pass" placeholder="Senha">
                </div>
                <div class="caixaput">
                    <i class="bi bi-key"></i>
                    <input type="password" required class="pass-input" id="input-pass-confirm" placeholder="Confirmar senha">
                </div>
                <select id="option">
                   <option selected disabled>País</option>
                </select>
                </form>
                <input value="Cadastrar" class="btn-cad" id="cad" type="submit">
            </div>
        </article>
    </main>
    <script  src="../main.js" defer></script>

    <script src="../js/login.js" defer type="module"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
