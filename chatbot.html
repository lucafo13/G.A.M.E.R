    <meta charset="UTF-8">

    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script src="JS/index.js" defer></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/14.8.1/math.js" integrity="sha512-AJmFmOXFAAzxbzp498VFGf+/Ke7n/O/Pz7L7R2in/4lEDkqhFvuIemyJo/MzXORunJkrJngeIyaWqLAj2rTY2Q==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<body>
    <nav>
      <div class="imgnav">
        <img src="assets/icones/auradelcio.png" alt="Logo">
      </div>
      <ul class="op">
          <li><a href="index.html">Inicio</a></li>
          <li><a href="src/analises/analises.html">Analises</a></li>
          <li><a href="chatbot.html">ChatBot</a></li>
          <li><a href="src/sobre/sobre.html">sobre</a></li>
          <li><a href="#contato">Contato</a></li>
          <li><a href="" id="name"></a></li>
      </ul>
      <div class="login">
        <button id="login">Login</button>
      </div>
    </nav>

    <div class="chatbot-scope">
        <div id="chatBox" class="chat-box"></div>
        
        <form class="chat-input-area" id="chatForm">
            <input type="text" id="userInput" placeholder="Digite sua dúvida..." required>
            <button type="submit"><i class="bi bi-send-fill"></i></button>
        </form>
    </div>
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/js/bootstrap.min.js" integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module" src="/src/main.js"></script>

    <script type="module">
        import { enviarMensagemAoBot } from './src/chatbot.js';

        const chatForm = document.getElementById('chatForm');
        const userInput = document.getElementById('userInput');
        const chatBox = document.getElementById('chatBox');

        function adicionarMensagem(texto, remetente) {
            const row = document.createElement('div');
            row.classList.add('message-row', remetente);

            const avatar = document.createElement('div');
            avatar.classList.add('avatar');
            
            
            avatar.innerHTML = remetente === 'bot' 
                ? '<img src="assets/icones/perfilbot.png" class="foto-bot">' 
                : '<i class="bi bi-person-fill"></i>';
            
            const bubble = document.createElement('div');
            bubble.classList.add('message-bubble');
            
            
            bubble.innerHTML = texto.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');

            row.appendChild(avatar);
            row.appendChild(bubble);
            chatBox.appendChild(row);

            chatBox.scrollTop = chatBox.scrollHeight;
        }

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const mensagem = userInput.value.trim();
            if (!mensagem) return;

            userInput.disabled = true;
            userInput.value = '';
            
            adicionarMensagem(mensagem, 'user');

            const rowLoading = document.createElement('div');
            rowLoading.classList.add('message-row', 'bot', 'loading-row');
            
            // FOTO DO BOT NO LOADING TAMBÉM
            rowLoading.innerHTML = '<div class="avatar"><img src="assets/icones/perfilbot.png" class="foto-bot"></div><div class="message-bubble typing">Acessando base de dados da G.A.M.E.R...</div>';
            
            chatBox.appendChild(rowLoading);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const resposta = await enviarMensagemAoBot(mensagem);
                rowLoading.remove();
                adicionarMensagem(resposta, 'bot');
            } catch (error) {
                rowLoading.remove();
                adicionarMensagem("Ocorreu uma falha de conexão. Tente novamente.", 'bot');
            } finally {
                userInput.disabled = false;
                userInput.focus();
            }
        });
    </script> 
</body>
</html>
